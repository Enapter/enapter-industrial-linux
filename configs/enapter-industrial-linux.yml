header:
  version: 17

distro: enapter-industrial-linux
target: enapter-industrial-linux-image
machine: intel-corei7-64

env:
  DISTRO: null
  DISTRO_VERSION: null
  DL_DIR: /home/build/downloads
  GPL_SOURCES_ARTIFACT_NAME: null
  IMG_ARTIFACT_NAME: null
  IMG_FILE_ARTIFACT_NAME: null
  INITRAMFS_SPDX_ARTIFACT_NAME: null
  MODSIGN_SIGNING_CERT: null
  MODSIGN_SIGNING_KEY: null
  NVDCVE_API_KEY: null
  RAUC_CERT: null
  RAUC_KEY: null
  RAUC_KEYRING: null
  RAUC_UPDATE_ARTIFACT_NAME: null
  ROOTFS_SPDX_ARTIFACT_NAME: null
  SECURE_BOOT_SIGNING_CERT: null
  SECURE_BOOT_SIGNING_CERT_DER: null
  SECURE_BOOT_SIGNING_KEY: null
  SSTATE_DIR: /home/build/sstate-cache
  TMPDIR: /home/build/tmp
  UPDATE_ARTIFACT_NAME: null
  VEX_ARTIFACT_NAME: null
  VMDK_ARTIFACT_NAME: null

repos:
  bitbake:
    url: 'git://git.openembedded.org/bitbake'
    tag: 'yocto-5.0.11'
    path: "bitbake"
    layers:
      bitbake: excluded

  meta-enapter-linux:
    layers:
      meta-enapter-linux:

  openembedded-core:
    url: 'git://git.openembedded.org/openembedded-core'
    tag: 'yocto-5.0.11'
    layers:
      meta:

  meta-enapter:
    url: 'https://github.com/enapter/meta-enapter'
    tag: 'v3.0.0-rc5'
    layers:
      meta-enapter-core:

  meta-intel:
    url: 'git://git.yoctoproject.org/meta-intel.git'
    commit: '38e75c8c1059e5f37659c140c010eaa203238fd2'

  meta-openembedded:
    url: 'git://git.openembedded.org/meta-openembedded'
    commit: 'e8fd97d86af86cdcc5a6eb3f301cbaf6a2084943'
    layers:
      meta-filesystems:
      meta-initramfs:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:

  meta-rauc:
    url: 'https://github.com/rauc/meta-rauc.git'
    commit: 'a0f4a8b9986954239850b9d4256c003c91e6b931'

  meta-virtualization:
    url: 'git://git.yoctoproject.org/meta-virtualization'
    commit: 'a5449c0c50aa07d02186f548fe6bb6c1ce8823dc'

local_conf_header:
  10-base: |
    CONF_VERSION = "2"
    SPDX_PRETTY = "1"
    IMAGE_FSTYPES = "wic ext4"
    SKIP_META_VIRT_SANITY_CHECK = "1"
    INHERIT += "rm_work archiver"
    COPY_LIC_MANIFEST = "1"
    COPY_LIC_DIRS = "1"
    LICENSE_CREATE_PACKAGE = "1"
    ARCHIVER_MODE[diff] = "1"
